# CI for the agent dev gateway.
#
# The same commands the specification names, in the order it names them:
#
#   typecheck   tsc --noEmit
#   tests       node --test test/*.test.ts
#   build       tsc -p tsconfig.build.json
#   package     npm pack, then install the tarball and run the binary
#
# The last step is the one that matters for a package: a tarball that packs
# but does not install, or installs but does not start, is not a package.
#
# The package's own postinstall script starts the daemon. It checks the CI
# environment and does nothing there, so no daemon runs on the runner.

name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci

      - name: typecheck
        run: npm run typecheck

      - name: tests
        run: npm test

      - name: build
        run: npm run build

      - name: the packed package installs and runs
        run: |
          set -euo pipefail
          tarball="$(npm pack --pack-destination "$RUNNER_TEMP" | tail -1)"
          mkdir -p "$RUNNER_TEMP/verify"
          cd "$RUNNER_TEMP/verify"
          npm init --yes > /dev/null
          npm install "$RUNNER_TEMP/$tarball"
          # The binary is called by its path, never through npx: npx falls
          # back to the registry when it does not find a name locally, and
          # there is a different package called dev-gateway on npm.
          ./node_modules/.bin/dev-gateway --version
          ./node_modules/.bin/dev-gateway --help

      - name: what the tarball holds
        run: |
          set -euo pipefail
          npm pack --dry-run 2>&1 | sed -n '/Tarball Contents/,/Tarball Details/p'
