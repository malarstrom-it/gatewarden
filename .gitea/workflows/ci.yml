# CI for the agent dev gateway.
#
# The steps are the ones the specification names: typecheck, tests, build,
# and a package that a consumer can install and run.
#
# The steps are separate jobs on purpose. Gitea reports one commit status
# per job, so a failing run says which step failed and not only that
# something did.
#
# The package's own postinstall script starts the daemon. It checks the CI
# environment and does nothing there, so no daemon runs on the runner.

name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run typecheck

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
      - name: what the tarball holds
        run: npm pack --dry-run

  package:
    name: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: the packed package installs and runs
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          tarball="$(npm pack --pack-destination "$work" | tail -1)"
          mkdir -p "$work/consumer"
          cd "$work/consumer"
          npm init --yes > /dev/null
          npm install "$work/$tarball"
          # The binary is called by its path, never through npx: npx falls
          # back to the registry when it does not find a name locally, and
          # there is a different package called dev-gateway on npm.
          ./node_modules/.bin/dev-gateway --version
          ./node_modules/.bin/dev-gateway --help
