# CI for the agent dev gateway.
#
# The steps are the ones the specification names: typecheck, tests, build,
# and a package that a consumer can install and run.
#
# The steps are separate jobs on purpose. Gitea reports one commit status
# per job, so a failing run says which step failed and not only that
# something did.
#
# The tests are one job per test file. Two of the test files need the
# compiled output of the repository: one builds it and reads it, the other
# packs the package, and the pack builds it again. The build deletes
# `dist/` before it writes it, so the two must not run at the same time.
# One job per file gives every job its own copy of the repository, and it
# makes a failing run name the file that failed.
#
# The package's own postinstall script starts the daemon. It checks the CI
# environment and does nothing there, so no daemon runs on the runner.

name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run typecheck

  test:
    name: test (${{ matrix.file }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    fail-fast: false
    strategy:
      matrix:
        file:
          - adapters.test.ts
          - build.test.ts
          - cli-lifecycle.test.ts
          - cli-setup.test.ts
          - cli.test.ts
          - config.test.ts
          - core-isolation.test.ts
          - daemon-config.test.ts
          - daemon-control.test.ts
          - daemon.test.ts
          - docs.test.ts
          - document.test.ts
          - golden.test.ts
          - healthcheck.test.ts
          - lock.test.ts
          - mcp-conformance.test.ts
          - mcp-server.test.ts
          - migrate.test.ts
          - net.test.ts
          - packaging.test.ts
          - paths.test.ts
          - pi-extension.test.ts
          - postinstall.test.ts
          - published-identifiers.test.ts
          - registry.test.ts
          - relay.test.ts
          - service.test.ts
          - slug.test.ts
          - state.test.ts
          - testenv.test.ts
          - websocket.test.ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: node --test "test/${{ matrix.file }}"

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
      - name: what the tarball holds
        run: npm pack --dry-run

  package:
    name: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: the packed package installs and runs
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          tarball="$(npm pack --pack-destination "$work" | tail -1)"
          mkdir -p "$work/consumer"
          cd "$work/consumer"
          npm init --yes > /dev/null
          npm install "$work/$tarball"
          # The binary is called by its path, never through npx: npx falls
          # back to the registry when it does not find a name locally, and
          # there is a different package called dev-gateway on npm.
          ./node_modules/.bin/dev-gateway --version
          ./node_modules/.bin/dev-gateway --help
