# Publish the gatewarden to an npm registry.
#
# The trigger is a tag: `v1.2.3` stages version 1.2.3. The tag and the
# version in package.json must agree, or the run stops.
#
# The publish goes through npm's staged publishing, not straight to the
# registry. `npm stage publish` puts the version in a staging area, and a
# maintainer approves it with two-factor authentication afterwards, either in
# the CLI (`npm stage approve <stage-id>`) or on npmjs.com in the "Staged
# Packages" tab of the package page. The approval is a human step, so it is
# not part of the run: the run ends with the version staged.
#
# Two secrets, both set in the repository on Gitea
# (Settings -> Actions -> Secrets):
#
#   NPM_TOKEN      the token that stages. Use a granular access token with
#                  "read and write (stage only)" and "bypass 2FA":
#
#                    npm token create \
#                      --packages-and-scopes-permission read-write-stage-only \
#                      --bypass-2fa
#
#                  A stage only token cannot publish straight to the
#                  registry, it can only stage, and staging asks for no
#                  two-factor prompt, which no CI run can answer. The
#                  permission value "read-write-stage-only" needs npm 12 to
#                  create; npm 11 does not know it.
#
#                  The token alone is not enough. Two more things must hold:
#
#                  * The npm account of the token must be allowed to write
#                    the scope of the package. Either the account owns the
#                    scope (its name is the scope) or it is a member of the
#                    organisation that owns the scope. A token of another
#                    account cannot stage the package, and the registry
#                    hides that behind "404 Not Found".
#
#                  * The npm account of the token must have two-factor
#                    authentication on, because the approval of a staged
#                    version asks for it. A direct publish with a token that
#                    cannot answer the prompt is refused with "Two-factor
#                    authentication is required to publish this package but
#                    an automation token was specified". For a package that
#                    does not exist yet, the registry hides that refusal
#                    behind "404 Not Found" on the publish.
#
#                  Staged publishing is the way out for Gitea Actions. npm's
#                  trusted publishing works for GitHub Actions and GitLab CI,
#                  but not for Gitea Actions.
#
#   NPM_REGISTRY   optional. Without it the package goes to
#                  https://registry.npmjs.org. Set it to a staging
#                  registry to publish a rehearsal first.
#
# The token never leaves the runner: it is read from the secret and passed
# to npm as NODE_AUTH_TOKEN, which npm writes into the runner's .npmrc.
#
# Staged publishing needs npm CLI 11.15.0 or later and Node 22.14.0 or
# later. The runner comes with an older npm, so the job upgrades npm before
# it stages. The npm that lands there is npm 12, and npm 12 wants Node
# ^22.22.2 || ^24.15.0 || >=26, so the job wants Node 22.22.2 or later and
# asks the installed npm itself whether it runs on the node of the runner.
#
# A package that does not exist yet can be staged as well: npm 12 says
# "Staged publishing will allow you to create a new package if it does not
# exist". Such a package gets a placeholder version 0.0.0-stage in the
# registry. The placeholder is public, the staged version itself is not: it
# becomes public only when a maintainer approves it.
#
# npm provenance is not available here: npm only signs with GitHub Actions
# and GitLab CI, not with Gitea Actions.

name: publish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: ${{ secrets.NPM_REGISTRY || 'https://registry.npmjs.org' }}

      - name: the token must be alive
        run: |
          set -euo pipefail
          account="$(npm whoami)"
          echo "the token publishes as $account"
          echo "the account must be allowed to write the scope of the package"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - run: npm ci

      - name: the tag and the package version must agree
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF#refs/tags/v}"
          package_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$package_version" ]; then
            echo "the tag says $tag_version, package.json says $package_version" >&2
            exit 1
          fi
          echo "publishing $package_version"

      - name: typecheck
        run: npm run typecheck

      # npm's staged publishing needs npm CLI 11.15.0 or later and Node
      # 22.14.0 or later. The npm of the runner is older than that, so it
      # is upgraded here, right before the staging.
      #
      # The npm that lands here is npm 12, and npm 12 wants Node
      # ^22.22.2 || ^24.15.0 || >=26. The job therefore wants Node 22.22.2
      # or later, and it asks the installed npm itself whether it runs on
      # the node of the runner, so a future npm@latest that wants more
      # fails here and not in the middle of the staging.
      - name: npm must understand staged publishing
        run: |
          set -euo pipefail

          # is a released version at least as new as the wanted one?
          version_at_least() {
            awk -v have="$1" -v want="$2" 'BEGIN {
              n = split(have, h, ".")
              m = split(want, w, ".")
              for (i = 1; i <= 3; i++) {
                hv = (i <= n ? h[i] + 0 : 0)
                wv = (i <= m ? w[i] + 0 : 0)
                if (hv > wv) { print "yes"; exit }
                if (hv < wv) { print "no"; exit }
              }
              print "yes"
            }'
          }

          npm install -g npm@latest

          node_version="$(node --version)"
          echo "node $node_version"
          if [ "$(version_at_least "${node_version#v}" 22.22.2)" != "yes" ]; then
            echo "node $node_version is older than 22.22.2, npm@latest wants node ^22.22.2 || ^24.15.0 || >=26" >&2
            exit 1
          fi

          # npm says on stderr that it does not support this node, and goes
          # on anyway. That is not good enough for a release.
          warnings="$(mktemp)"
          npm_version="$(npm --version 2>"$warnings")"
          cat "$warnings"
          if grep -q "does not support Node.js" "$warnings"; then
            echo "npm $npm_version does not support node $node_version" >&2
            exit 1
          fi
          echo "npm $npm_version"

          case "$npm_version" in
            *-*)
              echo "npm $npm_version is a pre-release, staged publishing needs a released npm" >&2
              exit 1
              ;;
          esac
          if [ "$(version_at_least "$npm_version" 11.15.0)" != "yes" ]; then
            echo "npm $npm_version is older than 11.15.0, staged publishing needs 11.15.0 or later" >&2
            exit 1
          fi

      # `npm stage publish` runs prepublishOnly, which is `npm run build &&
      # npm test`. The build and the tests are therefore the gate of the
      # staging.
      #
      # The run stages the version and stops there. The approval of a staged
      # version is a human step: a maintainer approves it with 2FA in the
      # CLI or on npmjs.com. The run does not wait for that approval, and it
      # does not fail because the approval has not come yet: the staging
      # itself is the last thing the run does, and it ends with exit 0.
      # A staging that fails is a failure of the release and fails the job.
      - name: stage the publish
        run: |
          set -uo pipefail
          status=0
          npm stage publish --access public || status=$?
          if [ "$status" -ne 0 ]; then
            echo "staging failed, npm exited with $status" >&2
            echo "the version is not staged and nothing is published" >&2
            echo "check the token: npm whoami" >&2
            echo "check that the account may write the scope @malarstrom" >&2
            exit "$status"
          fi
          echo "staged - a maintainer approves the version with 2FA on npmjs.com"
          echo "in the CLI: npm stage approve <stage-id>"
          echo "on npmjs.com: the package page, the Staged Packages tab"
          echo "a package that did not exist yet shows up as 0.0.0-stage"
          npm stage list || true
          exit 0
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
