# A temporary instrument: when a test fails, keep its output in a branch
# that can be fetched. Gitea 1.22 has no API for the log of a job.
name: diagnose

on:
  push:
    branches: [feat/npm-package]

jobs:
  one:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        name:
          - stop stops the daemon
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: run the test
        id: test
        run: |
          set -o pipefail
          node --test --test-name-pattern "${{ matrix.name }}" test/cli-lifecycle.test.ts 2>&1 | tee test-output.txt
      - name: keep the output of the failing test in a branch
        if: steps.test.outcome == 'failure'
        run: |
          git config user.name "ci"
          git config user.email "ci@localhost"
          git add test-output.txt
          git commit -q -m "the output of the failing test" || true
          git push --force origin HEAD:refs/heads/ci-failures
