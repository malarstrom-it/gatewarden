# Publish the gatewarden to npmjs.org, from GitHub.
#
# The repository of the project lives on GitHub, and the package is
# published from it.
#
# **This release goes out with a token, and it is staged.** The package
# is not on the registry yet: `@malarstrom/gatewarden` has never been
# published, and npm accepts a trusted publisher only for a package that
# is already there — a package comes into being with its first publish.
# The first publish therefore needs a token, and the token is the
# organisation secret `NPM_TOKEN` of the organisation `malarstrom-it` on
# GitHub. The job below puts it into the environment of the run as
# `NODE_AUTH_TOKEN`, and `actions/setup-node` writes the `.npmrc` that
# reads that variable. The token is a secret of the organisation and not
# of this repository, and its value is never written down.
#
# **The run stages the version, and a maintainer promotes it.** The token
# is a stage-only token: it may put a version on the registry as a stage
# that no reader can install, and it may not publish a version that the
# world can install. The workflow therefore runs `npm stage publish`, and
# the maintainer approves the stage with their two-factor code
# (`npm stage approve <stage-id> --otp <code>`). That is how npm wants
# the automation to work: the ability to publish a version directly with
# a token is removed in January 2027, and the staged way is the way
# forward.
#
# The trusted publishing path comes back for the releases after this one:
# task S121 (traefik-api/136) puts it back. Until then this file has one
# way to publish, and it is the token. The runbook for this release and
# for the ones after it is in `CONTRIBUTING.md`.
#
# The trigger is a tag: `v1.2.3` stages version 1.2.3. The tag and the
# version in package.json must agree, or the run stops.
#
# The tag is pushed to the branch the package is developed on,
# `feat/npm-package`, and the run uses the workflow file that the tag
# names. No push of a branch publishes anything: this workflow has one
# trigger and it is the tag.
#
# The run asks GitHub for an OpenID Connect token — the `id-token: write`
# permission below is what makes GitHub give one — and `npm stage publish
# --provenance` gives it to npm, which signs the staged version with it.
# The provenance says which repository, which workflow and which commit
# the version came from, and a reader can verify it with `npm audit
# signatures`. The permission stays in place for the provenance.
#
# What the trusted publisher on npmjs.com needs, for the releases after
# this one: the package page of `@malarstrom/gatewarden`, the settings of
# the package, the trusted publisher for GitHub Actions. There the owner,
# the name of the repository, the name of the workflow file, the
# environment name and the allowed actions are filled in:
#
#   * the owner is the organisation that owns the repository on GitHub,
#     `malarstrom-it`;
#   * the repository is `gatewarden`;
#   * the workflow file is `publish.yml`, and it has to live in
#     `.github/workflows/`. npm checks the path, and a workflow somewhere
#     else is not the workflow that was connected;
#   * the environment name is empty: the project uses no GitHub
#     environment, and this workflow names none;
#   * **the allowed actions have to allow `npm stage publish`.** npm's
#     staged publishing is the way the automation publishes, and the
#     direct publish is a separate permission that npm removes for
#     tokens in January 2027. The staged publish is the permission that
#     has to be on, and the command line that connects the trusted
#     publisher says `--allow-stage-publish`;
#   * the `repository` field of `package.json` has to name the same
#     repository — npm checks it, because a credential for one repository
#     must not publish another one. The manifest names
#     `github.com/malarstrom-it/gatewarden`, and it does.
#
#   A connection that is made and then not used expires: npm wants the
#   first successful publish within two days of the connection, and a
#   connection that is not used in that time has to be made again.
#
# The registry is npmjs.org, and it is written down instead of being a
# secret. A rehearsal against another registry is not possible with a
# token that is written for npmjs.org.
#
# `npm stage publish` runs `prepublishOnly`, which is `npm run build &&
# npm test`. The build and the tests are therefore the gate of the
# publish.
#
# The npm of the runner is older than the version npm asks for, and the
# job upgrades npm before it publishes.

name: publish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    # The job installs the dependencies, builds the package, runs the
    # tests and publishes it. The timeout keeps a run that hangs from
    # holding the runner for ever.
    timeout-minutes: 30
    permissions:
      # The workflow reads the repository ...
      contents: read
      # ... and asks GitHub for an OpenID Connect token. The token signs
      # the provenance of the published version.
      id-token: write
    env:
      # The token of this release: the organisation secret `NPM_TOKEN` of
      # the organisation `malarstrom-it` on GitHub. `actions/setup-node`
      # writes the `.npmrc` that reads this variable, and npm reads the
      # token from it. The value of the token is not in this repository.
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - name: the tag and the package version must agree
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF#refs/tags/v}"
          package_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$package_version" ]; then
            echo "the tag says $tag_version, package.json says $package_version" >&2
            exit 1
          fi
          echo "publishing $package_version"

      - name: typecheck
        run: npm run typecheck

      # npm needs a recent npm, and the npm of the runner is older than
      # that, so it is upgraded here, right before the publish.
      #
      # The npm that lands here is npm 12, and npm 12 wants Node
      # ^22.22.2 || ^24.15.0 || >=26. The job therefore wants Node 22.22.2
      # or later, and it asks the installed npm itself whether it runs on
      # the node of the runner, so a future npm@latest that wants more
      # fails here and not in the middle of the publish.
      #
      # The gate stays for the staged publish as well: npm 11.5.1 or later
      # is what the trusted publishing path of the releases after this one
      # asks for, and the same job serves both paths. Staged publishing
      # came with npm 11.5.0, so this npm has it.
      - name: npm must support staged publishing and trusted publishing
        run: |
          set -euo pipefail

          # is a released version at least as new as the wanted one?
          version_at_least() {
            awk -v have="$1" -v want="$2" 'BEGIN {
              n = split(have, h, ".")
              m = split(want, w, ".")
              for (i = 1; i <= 3; i++) {
                hv = (i <= n ? h[i] + 0 : 0)
                wv = (i <= m ? w[i] + 0 : 0)
                if (hv > wv) { print "yes"; exit }
                if (hv < wv) { print "no"; exit }
              }
              print "yes"
            }'
          }

          npm install -g npm@latest

          node_version="$(node --version)"
          echo "node $node_version"
          if [ "$(version_at_least "${node_version#v}" 22.22.2)" != "yes" ]; then
            echo "node $node_version is older than 22.22.2, npm@latest wants node ^22.22.2 || ^24.15.0 || >=26" >&2
            exit 1
          fi

          # npm says on stderr that it does not support this node, and goes
          # on anyway. That is not good enough for a release.
          warnings="$(mktemp)"
          npm_version="$(npm --version 2>"$warnings")"
          cat "$warnings"
          if grep -q "does not support Node.js" "$warnings"; then
            echo "npm $npm_version does not support node $node_version" >&2
            exit 1
          fi
          echo "npm $npm_version"

          case "$npm_version" in
            *-*)
              echo "npm $npm_version is a pre-release, trusted publishing needs a released npm" >&2
              exit 1
              ;;
          esac
          if [ "$(version_at_least "$npm_version" 11.5.1)" != "yes" ]; then
            echo "npm $npm_version is older than 11.5.1, trusted publishing needs 11.5.1 or later" >&2
            exit 1
          fi

      # The stage itself. The credential is the token of the
      # environment above: npm reads it from the `.npmrc` that
      # `actions/setup-node` wrote.
      #
      # `npm stage publish` runs `prepublishOnly`, which is `npm run build
      # && npm test`. The build and the tests are therefore the gate of the
      # publish, and they have run in this job already.
      #
      # The token is stage-only, so the version lands on the registry as a
      # stage and not as a version the world can install. A maintainer
      # promotes it with `npm stage approve <stage-id> --otp <code>`; the
      # runbook says where the stage id is found.
      #
      # The provenance says which repository, which workflow and which
      # commit the published version came from. A reader can check it with
      # `npm audit signatures`.
      - name: stage
        run: npm stage publish --provenance --access public
